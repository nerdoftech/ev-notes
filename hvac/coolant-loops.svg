<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="aheat" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker><marker id="abatt" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2ca02c"/></marker><marker id="aref" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker><marker id="adrv" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff7f0e"/></marker></defs><rect width="1600" height="1000" fill="#fff"/><text x="800" y="45" font-size="28" fill="#222" text-anchor="middle" font-weight="bold">GMT900 EV coolant and refrigerant loops (concept)</text><rect x="40" y="70" width="720" height="320" rx="12" fill="#d62728" fill-opacity="0.05" stroke="#d62728" stroke-dasharray="6 4"/><text x="52" y="94" font-size="17" fill="#d62728" text-anchor="start" font-weight="bold">1. Heater loop (hot, 70–85 °C)</text><rect x="800" y="70" width="760" height="320" rx="12" fill="#1f77b4" fill-opacity="0.05" stroke="#1f77b4" stroke-dasharray="6 4"/><text x="812" y="94" font-size="17" fill="#1f77b4" text-anchor="start" font-weight="bold">2. Refrigerant (R134a)</text><rect x="40" y="400" width="1520" height="370" rx="12" fill="#2ca02c" fill-opacity="0.05" stroke="#2ca02c" stroke-dasharray="6 4"/><text x="52" y="758" font-size="17" fill="#2ca02c" text-anchor="start" font-weight="bold">3. Battery loop (keep inlet ≤ 35–40 °C, warm to ~15–20 °C)</text><rect x="40" y="785" width="900" height="195" rx="12" fill="#ff7f0e" fill-opacity="0.05" stroke="#ff7f0e" stroke-dasharray="6 4"/><text x="52" y="809" font-size="17" fill="#ff7f0e" text-anchor="start" font-weight="bold">4. Drive unit loop (LDU + OI board)</text><path d="M260,185 L430,185" fill="none" stroke="#d62728" stroke-width="4" marker-end="url(#aheat)"/><path d="M640,185 L680,185 L680,418 L480,418" fill="none" stroke="#d62728" stroke-width="4" marker-end="url(#aheat)"/><path d="M300,418 L222,418" fill="none" stroke="#d62728" stroke-width="4" marker-end="url(#aheat)"/><path d="M178,418 L120,418 L120,185 L100,185" fill="none" stroke="#d62728" stroke-width="4" /><path d="M100,185 L100,185" fill="none" stroke="#d62728" stroke-width="4" /><path d="M120,185 L100,185" stroke="#d62728" stroke-width="4"/><rect x="100" y="150" width="160" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="180.0" y="181.0" text-anchor="middle" font-size="18" font-weight="bold">Diesel heater</text><text x="180.0" y="201.0" text-anchor="middle" font-size="14" fill="#444">~5 kW, own fuel tank</text><rect x="430" y="150" width="210" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="535.0" y="181.0" text-anchor="middle" font-size="18" font-weight="bold">Heater core</text><text x="535.0" y="201.0" text-anchor="middle" font-size="14" fill="#444">stock GMT900 HVAC box</text><circle cx="200" cy="418" r="22" fill="#fff" stroke="#333" stroke-width="2"/><text x="200" y="424" text-anchor="middle" font-size="16" font-weight="bold">P1</text><text x="470" y="250" font-size="14" fill="#444" text-anchor="middle" font-weight="normal">Factory blend doors, vents,</text><text x="520" y="268" font-size="14" fill="#444" text-anchor="middle" font-weight="normal">defrost unchanged</text><rect x="300" y="400" width="180" height="70" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><line x1="300" y1="435" x2="480" y2="435" stroke="#333" stroke-dasharray="4 3"/><text x="390" y="423" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">Plate HX (hot side)</text><text x="390" y="458" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">(cold side)</text><path d="M1020,165 L1180,165" fill="none" stroke="#1f77b4" stroke-width="4" marker-end="url(#aref)"/><path d="M1340,165 L1500,165 L1500,295 L1340,295" fill="none" stroke="#1f77b4" stroke-width="4" marker-end="url(#aref)"/><path d="M1180,295 L940,295 L940,200" fill="none" stroke="#1f77b4" stroke-width="4" marker-end="url(#aref)"/><path d="M1500,295 L1500,418 L1280,418" fill="none" stroke="#1f77b4" stroke-width="4" marker-end="url(#aref)"/><path d="M1100,418 L940,418 L940,295" fill="none" stroke="#1f77b4" stroke-width="4" /><rect x="860" y="130" width="160" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="940.0" y="161.0" text-anchor="middle" font-size="18" font-weight="bold">A/C compressor</text><text x="940.0" y="181.0" text-anchor="middle" font-size="14" fill="#444">Tesla, CAN 0x28A</text><rect x="1180" y="130" width="160" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="1260.0" y="161.0" text-anchor="middle" font-size="18" font-weight="bold">Condenser</text><text x="1260.0" y="181.0" text-anchor="middle" font-size="14" fill="#444">front, with fan</text><rect x="1180" y="260" width="160" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="1260.0" y="291.0" text-anchor="middle" font-size="18" font-weight="bold">Evaporator</text><text x="1260.0" y="311.0" text-anchor="middle" font-size="14" fill="#444">stock, TXV</text><rect x="1100" y="400" width="180" height="70" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><line x1="1100" y1="435" x2="1280" y2="435" stroke="#333" stroke-dasharray="4 3"/><text x="1190" y="423" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">Chiller (refrig side)</text><text x="1190" y="458" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">(coolant side)</text><text x="1490" y="360" font-size="14" fill="#444" text-anchor="end" font-weight="normal">solenoid + TXV</text><text x="1490" y="378" font-size="14" fill="#444" text-anchor="end" font-weight="normal">(ZV switched)</text><path d="M480,452 L720,452" fill="none" stroke="#2ca02c" stroke-width="4" marker-end="url(#abatt)"/><path d="M880,452 L1100,452" fill="none" stroke="#2ca02c" stroke-width="4" marker-end="url(#abatt)"/><path d="M1280,452 L1440,452 L1440,555 L1220,555" fill="none" stroke="#2ca02c" stroke-width="4" marker-end="url(#abatt)"/><path d="M1440,555 L1440,675 L1220,675" fill="none" stroke="#2ca02c" stroke-width="4" marker-end="url(#abatt)"/><path d="M1000,555 L900,555 L900,675 L1000,675" fill="none" stroke="#2ca02c" stroke-width="4" /><path d="M900,615 L820,615" fill="none" stroke="#2ca02c" stroke-width="4" marker-end="url(#abatt)"/><path d="M700,615 L522,615" fill="none" stroke="#2ca02c" stroke-width="4" marker-end="url(#abatt)"/><path d="M478,615 L200,615 L200,452 L300,452" fill="none" stroke="#2ca02c" stroke-width="4" marker-end="url(#abatt)"/><rect x="720" y="425" width="160" height="55" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="800.0" y="448.5" text-anchor="middle" font-size="18" font-weight="bold">Electric heater</text><text x="800.0" y="468.5" text-anchor="middle" font-size="14" fill="#444">optional, for charging</text><rect x="1000" y="520" width="220" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="1110.0" y="551.0" text-anchor="middle" font-size="18" font-weight="bold">Front pack</text><text x="1110.0" y="571.0" text-anchor="middle" font-size="14" fill="#444">6 modules, engine bay</text><rect x="1000" y="640" width="220" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="1110.0" y="671.0" text-anchor="middle" font-size="18" font-weight="bold">Rear pack</text><text x="1110.0" y="691.0" text-anchor="middle" font-size="14" fill="#444">8 modules, frame rails</text><rect x="700" y="590" width="120" height="50" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="760.0" y="621.0" text-anchor="middle" font-size="18" font-weight="bold">Reservoir</text><circle cx="500" cy="615" r="22" fill="#fff" stroke="#333" stroke-width="2"/><text x="500" y="621" text-anchor="middle" font-size="16" font-weight="bold">P2</text><text x="1260" y="545" font-size="16" fill="#2ca02c" text-anchor="start" font-weight="bold">T</text><text x="1260" y="665" font-size="16" fill="#2ca02c" text-anchor="start" font-weight="bold">T</text><text x="1110" y="730" font-size="14" fill="#444" text-anchor="middle" font-weight="normal">Parallel branches; balance flow so both packs see the same inlet temp</text><text x="560" y="700" font-size="14" fill="#444" text-anchor="start" font-weight="normal">Optional bypass to drive-unit radiator for mild-weather cooling</text><path d="M380,875 L458,875" fill="none" stroke="#ff7f0e" stroke-width="4" marker-end="url(#adrv)"/><path d="M502,875 L560,875" fill="none" stroke="#ff7f0e" stroke-width="4" marker-end="url(#adrv)"/><path d="M820,875 L890,875 L890,950 L110,950 L110,875 L160,875" fill="none" stroke="#ff7f0e" stroke-width="4" marker-end="url(#adrv)"/><rect x="160" y="840" width="220" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="270.0" y="871.0" text-anchor="middle" font-size="18" font-weight="bold">Radiator</text><text x="270.0" y="891.0" text-anchor="middle" font-size="14" fill="#444">stock location, fan</text><circle cx="480" cy="875" r="22" fill="#fff" stroke="#333" stroke-width="2"/><text x="480" y="881" text-anchor="middle" font-size="16" font-weight="bold">P3</text><rect x="560" y="840" width="260" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="690.0" y="871.0" text-anchor="middle" font-size="18" font-weight="bold">LDU + OI inverter</text><text x="690.0" y="891.0" text-anchor="middle" font-size="14" fill="#444">separate glycol loop</text><text x="980" y="815" font-size="17" fill="#222" text-anchor="start" font-weight="bold">ZV control (all switched by the ZV)</text><text x="980" y="845" font-size="14" fill="#222" text-anchor="start" font-weight="normal">• Diesel heater: enable when cabin heat requested or pack cold</text><text x="980" y="867" font-size="14" fill="#222" text-anchor="start" font-weight="normal">• P1: runs with heater; P2: runs when pack below setpoint or chilling</text><text x="980" y="889" font-size="14" fill="#222" text-anchor="start" font-weight="normal">• Chiller solenoid: open when pack above ~35 °C (needs compressor on)</text><text x="980" y="911" font-size="14" fill="#222" text-anchor="start" font-weight="normal">• Compressor: 0x28A duty from cabin A/C request + chiller demand</text><text x="980" y="933" font-size="14" fill="#222" text-anchor="start" font-weight="normal">• P3 + radiator fan: from LDU / inverter temps</text><text x="980" y="955" font-size="14" fill="#222" text-anchor="start" font-weight="normal">• Module temps (T) come from the BMS</text></svg>